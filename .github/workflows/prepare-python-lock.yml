name: Generate pinned Python dependencies (one-time migration)
on:
  push:
    branches: [chore/contabo-migration-readiness-2026-11-08]
    paths:
      - '.github/workflows/prepare-python-lock.yml'
permissions:
  contents: write
jobs:
  python-lock:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Resolve full production API and test dependency graph
        run: |
          python -m pip install -r apps/api/requirements.txt
          python -m pip freeze > apps/api/requirements.lock.txt
      - name: Commit pinned transitive versions on migration branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/requirements.lock.txt
          git diff --cached --quiet && exit 0
          git commit -m "build: pin Python API dependency graph"
          git push origin HEAD:chore/contabo-migration-readiness-2026-11-08
