name: CI
on:
  pull_request:
  push:
    branches: [main, 'feature/**']
jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install Python dependencies
        working-directory: apps/api
        run: pip install -r requirements.lock.txt
      - name: Audit Python production dependencies
        working-directory: apps/api
        run: |
          python -m pip install pip-audit==2.9.0
          python -m pip_audit -r requirements.lock.txt
      - name: Run Python tests
        working-directory: apps/api
        run: python -m pytest -q
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install frontend dependencies
        working-directory: apps/web
        run: npm ci --no-audit
      - name: Audit production npm dependencies
        working-directory: apps/web
        run: npm audit --omit=dev --audit-level=high
      - name: Build frontend
        working-directory: apps/web
        run: npm run build
      - name: Validate WE shared-host Compose has no published DB, storage or app ports
        run: |
          cp .env.example .env
          WE_STAGING_HOST=we-staging.example.org docker compose --env-file .env \
            -f compose.shared-ingress.yaml config --quiet
          python3 - <<'PY'
          import json
          import os
          import subprocess

          env = dict(os.environ, WE_STAGING_HOST="we-staging.example.org")
          out = subprocess.check_output(
              ["docker", "compose", "--env-file", ".env",
               "-f", "compose.shared-ingress.yaml", "config", "--format", "json"],
              text=True, env=env,
          )
          config = json.loads(out)["services"]
          assert set(config) == {"db", "minio", "api", "web"}
          assert all(not service.get("ports") for service in config.values())
          for name in ("db", "minio", "api"):
              assert set(config[name]["networks"]) == {"private"}
          assert set(config["web"]["networks"]) == {"ingress", "private"}
          print("WE shared-host topology validated; no host ports or storage exposure.")
          PY
      - name: Smoke test production nginx container and SPA fallback
        run: |
          docker build -t workspace-emlen-web-smoke -f apps/web/Dockerfile .
          docker run -d --name workspace-emlen-web-smoke --add-host api:127.0.0.1 -p 127.0.0.1:18080:80 workspace-emlen-web-smoke
          docker exec workspace-emlen-web-smoke nginx -t
          curl --fail --silent --show-error --retry 12 --retry-connrefused --retry-delay 2 http://127.0.0.1:18080/ | grep -F '<div id="root"></div>'
          curl --fail --silent --show-error http://127.0.0.1:18080/any/client/route | grep -F '<div id="root"></div>'
      - name: Print nginx diagnostics on failure
        if: failure()
        run: docker logs workspace-emlen-web-smoke || true
