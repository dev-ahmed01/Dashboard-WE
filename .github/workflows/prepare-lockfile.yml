name: Generate committed frontend lockfile (one-time migration)
on:
  push:
    branches: [chore/contabo-migration-readiness-2026-11-08]
    paths:
      - '.github/workflows/prepare-lockfile.yml'
permissions:
  contents: write
jobs:
  lockfile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Resolve and lock frontend dependencies
        working-directory: apps/web
        run: npm install --package-lock-only --no-audit --no-fund
      - name: Commit reproducible lockfile on this specific migration branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "build: lock frontend npm dependencies"
          git push origin HEAD:chore/contabo-migration-readiness-2026-11-08
