limit_req_zone $binary_remote_addr zone=admin_login:10m rate=5r/m;
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 9m;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  limit_req_status 429;
  location = /api/auth/login {
    limit_req zone=admin_login burst=5 nodelay;
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location /api/ { proxy_pass http://api:8000; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto; proxy_set_header X-Real-IP $remote_addr; }
  location /site/ { proxy_pass http://api:8000; proxy_set_header Host $host; }
  location = /sitemap.xml { proxy_pass http://api:8000; }
  location = /robots.txt { proxy_pass http://api:8000; }
  location / { try_files $uri $uri/ /index.html; }
}
