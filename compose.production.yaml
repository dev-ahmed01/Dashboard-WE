# WE CMS production topology. Public SaaS site is NOT automatically published.
# Central SaS-owned Caddy gateway is the only host listener on 80/443.
name: workspace-emlen-production
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: workspace
      POSTGRES_USER: workspace
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set private DB secret}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workspace -d workspace"]
      interval: 10s
      timeout: 5s
      retries: 12
    security_opt: ["no-new-privileges:true"]
    networks: [private]

  minio:
    image: pgsty/silo:RELEASE.2026-10-26T00-00-00Z
    command: server /data
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set private storage user}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set private storage secret}
    volumes:
      - object-data:/data
    security_opt: ["no-new-privileges:true"]
    networks: [private]

  api:
    build: ./apps/api
    restart: unless-stopped
    depends_on:
      db: {condition: service_healthy}
      minio: {condition: service_started}
    environment:
      APP_ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg://workspace:${POSTGRES_PASSWORD}@db:5432/workspace
      JWT_SECRET: ${JWT_SECRET:?Set private JWT secret}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set real admin email}
      ADMIN_USERNAME: ""
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set private first-admin password}
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:?Set real canonical website URL}
      CORS_ORIGIN: https://${WE_HOST:?Set dashboard HTTPS hostname}
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: workspace-assets
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/ready', timeout=5)"]
      interval: 20s
      timeout: 8s
      retries: 6
      start_period: 30s
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    init: true
    networks:
      private:
        aliases: [we-prod-api]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NGINX_CONFIG: deploy/nginx.production.conf
    restart: unless-stopped
    depends_on:
      api: {condition: service_healthy}
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, NET_BIND_SERVICE]
    init: true
    networks:
      private: {}
      ingress:
        aliases: [we-prod-web]

networks:
  private:
    internal: true
  ingress:
    external: true
    name: emlen_ingress

volumes:
  postgres-data:
  object-data:
